<!DOCTYPE html>
<html>
<head>
    <title>Three.js Model Viewer</title>
    <style>
        body { margin: 0; background: #111; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- We load Three.js and the GLTF loader via CDN -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com",
            "three/addons/": "https://unpkg.com"
        }
    }
</script>

    <script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting (Crucial for high quality)
        const light = new THREE.AmbientLight(0xffffff, 1); // Soft white light
        scene.add(light);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // 3. Controls (Mouse movement)
        const controls = new OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 2, 5);

        // 4. Loader for Multiple Models
        const loader = new GLTFLoader();

        function loadMyModel(path, positionX) {
            loader.load(path, (gltf) => {
                const model = gltf.scene;
                model.position.x = positionX;
                scene.add(model);
            }, undefined, (error) => {
                console.error('Error loading:', path, error);
            });
        }

        // Load your converted files here
        loadMyModel('./models/charlie.glb', -2);
        loadMyModel('./models/robinet.glb', 2);
		loadMyModel('./models/statuie_florilor.glb', 2);
		

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
