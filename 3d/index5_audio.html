<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0c0f;
            --panel: #0f1318;
            --border: #1e2530;
            --accent: #00c8ff;
            --accent2: #ff6b35;
            --accent3: #a855f7;
            --text: #c8d4e0;
            --text-dim: #4a5568;
            --active-bg: rgba(0, 200, 255, 0.08);
            --panel-w: 260px;
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        /* ── SIDEBAR ── */
        #sidebar {
            position: fixed;
            left: 0; top: 0;
            width: var(--panel-w);
            height: 100vh;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
        }

        #sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
        }

        .sidebar-header {
            padding: 28px 20px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header .label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .sidebar-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            line-height: 1.1;
        }

        /* ── MODEL LIST ── */
        .section-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            letter-spacing: 3px;
            color: var(--text-dim);
            text-transform: uppercase;
            padding: 20px 20px 10px;
        }

        #model-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }

        #model-list::-webkit-scrollbar { width: 3px; }
        #model-list::-webkit-scrollbar-track { background: transparent; }
        #model-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .model-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 4px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .model-btn::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.2s ease;
        }

        .model-btn.person-btn::before { background: var(--accent3); }

        .model-btn:hover {
            background: var(--active-bg);
            border-color: var(--border);
            color: #fff;
        }

        .model-btn.active {
            background: var(--active-bg);
            border-color: rgba(0, 200, 255, 0.25);
            color: var(--accent);
        }

        .model-btn.person-btn.active {
            border-color: rgba(168, 85, 247, 0.3);
            color: var(--accent3);
            background: rgba(168, 85, 247, 0.07);
        }

        .model-btn.active::before { transform: scaleY(1); }

        .model-btn .icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 15px;
            transition: background 0.2s;
        }

        .model-btn.active .icon            { background: rgba(0, 200, 255, 0.15); }
        .model-btn.person-btn.active .icon { background: rgba(168, 85, 247, 0.15); }

        .model-btn .name { flex: 1; }

        .model-btn .sub {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 300;
            display: block;
            line-height: 1;
            margin-top: 2px;
        }

        .model-btn.active .sub             { color: rgba(0, 200, 255, 0.5); }
        .model-btn.person-btn.active .sub  { color: rgba(168, 85, 247, 0.5); }

        /* ── CONTROLS SECTION ── */
        .controls-section {
            border-top: 1px solid var(--border);
            padding: 16px 20px 20px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .toggle-label { display: flex; flex-direction: column; }

        .toggle-label span { font-size: 15px; font-weight: 500; color: var(--text); }
        .toggle-label small { font-size: 11px; color: var(--text-dim); font-weight: 300; }

        /* Toggle switch */
        .toggle {
            position: relative;
            width: 44px; height: 24px;
            flex-shrink: 0;
        }

        .toggle input { opacity: 0; width: 0; height: 0; }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.25s;
        }

        .toggle-track::after {
            content: '';
            position: absolute;
            left: 3px; top: 3px;
            width: 18px; height: 18px;
            background: var(--text-dim);
            border-radius: 50%;
            transition: transform 0.25s, background 0.25s;
        }

        .toggle input:checked + .toggle-track {
            background: rgba(0, 200, 255, 0.2);
            border: 1px solid rgba(0, 200, 255, 0.4);
        }

        .toggle input:checked + .toggle-track::after {
            transform: translateX(20px);
            background: var(--accent);
            box-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
        }

        /* Walk-specific toggle accent */
        .walk-toggle-track.toggle-track { }
        #walk-toggle:checked + .toggle-track {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
        }
        #walk-toggle:checked + .toggle-track::after {
            background: var(--accent3);
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
        }

        /* Walk controls — hidden until Persoana loads */
        #walk-controls {
            display: none;
            padding: 10px 0 0;
            border-top: 1px solid var(--border);
            margin-top: 4px;
        }
        #walk-controls.visible { display: block; }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0 6px;
        }

        .slider-row label {
            font-size: 13px;
            color: var(--text-dim);
            white-space: nowrap;
            font-weight: 300;
        }

        input[type=range] {
            flex: 1;
            accent-color: var(--accent3);
            cursor: pointer;
        }

        #walk-speed-val {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--accent3);
            width: 24px;
            text-align: right;
        }

        #path-hint {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            letter-spacing: 1px;
            color: rgba(168, 85, 247, 0.5);
            padding: 4px 0 0;
            line-height: 1.6;
        }

        /* ── AUDIO PLAYER ── */
        .audio-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0 4px;
            border-top: 1px solid var(--border);
            margin-top: 6px;
        }

        .audio-play-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.35);
            color: var(--accent3);
            font-size: 13px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .audio-play-btn:hover {
            background: rgba(168, 85, 247, 0.25);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .audio-play-btn.playing {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--accent3);
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
        }

        .audio-info {
            flex: 1;
            min-width: 0;
        }

        .audio-info .audio-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-info .audio-status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-top: 1px;
        }

        .audio-info .audio-status.active { color: var(--accent3); }

        /* volume knob */
        #audio-vol {
            accent-color: var(--accent3);
            width: 56px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ── STATUS BAR ── */
        #status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            padding: 10px 20px 14px;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
        }

        #status .dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
            margin-right: 6px;
            vertical-align: middle;
            transition: background 0.3s;
        }

        #status.loading .dot { background: var(--accent2); animation: pulse 0.8s infinite; }
        #status.ready   .dot { background: #44ff88; }
        #status.error   .dot { background: #ff4444; }

        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.2} }

        /* ── CANVAS ── */
        #canvas-wrap {
            position: fixed;
            left: var(--panel-w);
            top: 0; right: 0; bottom: 0;
        }

        #canvas-wrap canvas { display:block; width:100%!important; height:100%!important; }

        /* ── OVERLAYS ── */
        #model-name-overlay {
            position: fixed;
            bottom: 32px;
            left: calc(var(--panel-w) + 32px);
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.15);
            pointer-events: none;
        }

        #loader-overlay {
            position: fixed;
            left: var(--panel-w);
            top: 0; right: 0; bottom: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #loader-overlay.visible { opacity:1; pointer-events:all; }

        .loader-inner { text-align: center; }
        .loader-ring {
            width:48px; height:48px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to{transform:rotate(360deg)} }
        .loader-text {
            font-family:'Share Tech Mono',monospace;
            font-size:11px; letter-spacing:3px; color:var(--text-dim);
        }

        #empty-state {
            position: fixed;
            left: var(--panel-w);
            top:0; right:0; bottom:0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 4;
        }
        .empty-inner { text-align:center; opacity:0.3; }
        .empty-icon  { font-size:48px; margin-bottom:16px; display:block; }
        .empty-inner p {
            font-family:'Share Tech Mono',monospace;
            font-size:11px; letter-spacing:3px; text-transform:uppercase;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="sidebar-header">
        <div class="label">// eyemap.ai</div>
        <h1>3D<br>Viewer</h1>
    </div>

    <div class="section-title">Models</div>

    <div id="model-list">
        <button class="model-btn" data-path="./models/charlie.glb" data-name="Charlie" data-type="model">
            <div class="icon">◈</div>
            <div class="name">Charlie<span class="sub">.glb</span></div>
        </button>
        <button class="model-btn" data-path="./models/robinet.glb" data-name="Robinet" data-type="model">
            <div class="icon">◈</div>
            <div class="name">Robinet<span class="sub">.glb</span></div>
        </button>
        <button class="model-btn" data-path="./models/statuie_florilor.glb" data-name="Statuie Florilor" data-type="model">
            <div class="icon">◈</div>
            <div class="name">Statuie Florilor<span class="sub">.glb</span></div>
        </button>
        <!-- Persoana — chroma-key video billboard -->
        <button class="model-btn person-btn"
                data-path="./models/vecteezy_a-man-in-a-suit-standing-in-front-of-a-green-screen.mp4"
                data-name="Persoana"
                data-type="person">
            <div class="icon">🧍</div>
            <div class="name">Persoana<span class="sub">chroma key · mp4</span></div>
        </button>
        <!-- Persoana M1 — chroma-key video + Robinet GLB combined -->
        <button class="model-btn person-btn"
                data-path="./models/vecteezy_a-man-in-a-suit-standing-in-front-of-a-green-screen.mp4"
                data-name="Persoana M1"
                data-type="person-m1"
                data-model="./models/robinet.glb">
            <div class="icon">🧍</div>
            <div class="name">Persoana M1<span class="sub">video + robinet</span></div>
        </button>
    </div>

    <div class="controls-section">
        <div class="section-title" style="padding:0 0 8px;">Controls</div>

        <!-- Auto-rotate (GLB models) -->
        <div class="toggle-row">
            <div class="toggle-label">
                <span>Auto Rotate</span>
                <small>Slow spin on Y axis</small>
            </div>
            <label class="toggle">
                <input type="checkbox" id="rotate-toggle">
                <div class="toggle-track"></div>
            </label>
        </div>

        <!-- Walk controls — visible only when Persoana is active -->
        <div id="walk-controls">
            <div class="toggle-row">
                <div class="toggle-label">
                    <span>Walk Path</span>
                    <small>Loop along curve</small>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="walk-toggle" checked>
                    <div class="toggle-track"></div>
                </label>
            </div>
            <div class="slider-row">
                <label>Speed</label>
                <input type="range" id="walk-speed" min="1" max="20" value="5" step="1">
                <span id="walk-speed-val">5</span>
            </div>
            <div class="slider-row">
                <label>Scale</label>
                <input type="range" id="person-scale" min="5" max="40" value="10" step="1">
                <span id="person-scale-val">1.0x</span>
            </div>
            <div id="path-hint">
                ▸ Click scene → F12 console<br>
                &nbsp;&nbsp;to log path coordinates
            </div>

            <!-- Audio player -->
            <div class="audio-row">
                <button class="audio-play-btn" id="audio-btn" title="Play / Stop audio">▶</button>
                <div class="audio-info">
                    <div class="audio-name">Cetățile Dacice</div>
                    <div class="audio-status" id="audio-status">STOPPED</div>
                </div>
                <input type="range" id="audio-vol" min="0" max="100" value="70" title="Volume">
            </div>
        </div>
    </div>

    <div id="status">
        <span class="dot"></span>
        <span id="status-text">SELECT A MODEL</span>
    </div>
</div>

<!-- CANVAS -->
<div id="canvas-wrap"></div>

<!-- LOADING OVERLAY -->
<div id="loader-overlay">
    <div class="loader-inner">
        <div class="loader-ring"></div>
        <div class="loader-text">LOADING MODEL</div>
    </div>
</div>

<!-- EMPTY STATE -->
<div id="empty-state">
    <div class="empty-inner">
        <span class="empty-icon">⬡</span>
        <p>Select a model</p>
    </div>
</div>

<!-- MODEL NAME OVERLAY -->
<div id="model-name-overlay"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── SCENE ────────────────────────────────────────────────────
const wrap       = document.getElementById('canvas-wrap');
const scene      = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c0f);

const camera = new THREE.PerspectiveCamera(50, wrap.clientWidth / wrap.clientHeight, 0.01, 1000);
camera.position.set(0, 1.5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.shadowMap.enabled   = true;
renderer.shadowMap.type      = THREE.PCFSoftShadowMap;
renderer.toneMapping         = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(5, 8, 5);
key.castShadow = true;
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.8);
fill.position.set(-5, 2, -3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x00c8ff, 0.4);
rim.position.set(0, -3, -5);
scene.add(rim);

// Grid floor
const grid = new THREE.GridHelper(20, 40, 0x1e2530, 0x141820);
grid.position.y = -0.01;
scene.add(grid);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance   = 0.5;
controls.maxDistance   = 50;

// ── DOM REFS ─────────────────────────────────────────────────
const loaderOverlay  = document.getElementById('loader-overlay');
const emptyState     = document.getElementById('empty-state');
const statusEl       = document.getElementById('status');
const statusText     = document.getElementById('status-text');
const nameOverlay    = document.getElementById('model-name-overlay');
const rotateToggle   = document.getElementById('rotate-toggle');
const walkControlsEl = document.getElementById('walk-controls');
const walkToggle     = document.getElementById('walk-toggle');
const walkSpeedInput = document.getElementById('walk-speed');
const walkSpeedVal   = document.getElementById('walk-speed-val');
const personScaleInput = document.getElementById('person-scale');
const personScaleVal   = document.getElementById('person-scale-val');
const audioBtn         = document.getElementById('audio-btn');
const audioStatusEl    = document.getElementById('audio-status');
const audioVolInput    = document.getElementById('audio-vol');

// ── STATE ─────────────────────────────────────────────────────
let currentModel = null;
let currentType  = null;   // 'model' | 'person'
let autoRotate   = false;
let isLoading    = false;

// Person state
let personGroup  = null;
let personMesh   = null;
let videoEl      = null;
let videoTex     = null;
let walkProgress = 0;
let walkActive   = true;
let personScale  = 1.0;

// ── AUDIO ─────────────────────────────────────────────────────
const audioEl     = new Audio('./models/audio1-cetatile-dacice.mp3');
audioEl.loop      = true;
audioEl.volume    = 0.70;
let audioPlaying  = false;
let walkSpeed    = 5 / 10000;   // units of path progress per ms

// ── WALKING PATH ─────────────────────────────────────────────
// Eight points forming an oval loop. Adjust X/Z to fit your monument.
// TIP: click the scene while Persoana is active → open F12 console
//      to log camera.position and use those values as waypoints.
const walkPath = new THREE.CatmullRomCurve3([
    new THREE.Vector3( 0,  0,  4),
    new THREE.Vector3( 2.5, 0,  2.5),
    new THREE.Vector3( 4,  0,  0),
    new THREE.Vector3( 2.5, 0, -2.5),
    new THREE.Vector3( 0,  0, -4),
    new THREE.Vector3(-2.5, 0, -2.5),
    new THREE.Vector3(-4,  0,  0),
    new THREE.Vector3(-2.5, 0,  2.5),
], true /* closed */);

// ── CHROMA KEY MATERIAL ───────────────────────────────────────
// Strategy: work in LINEAR colour space (video texture is sRGB,
// we decode it manually), then key on the cb/cr chroma channels
// which isolate green regardless of brightness — same approach
// used in professional compositing tools.
function makeChromaMaterial(tex) {
    return new THREE.ShaderMaterial({
        uniforms: {
            tex:       { value: tex },
            threshold: { value: 0.30 },   // decrease to cut more; increase to keep more
            smoothing: { value: 0.12 }    // soft edge width
        },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
            }
        `,
        fragmentShader: `
            varying vec2 vUv;
            uniform sampler2D tex;
            uniform float threshold;
            uniform float smoothing;

            // Convert sRGB -> linear (undo gamma so maths is correct)
            vec3 toLinear(vec3 c) {
                return pow(max(c, vec3(0.0)), vec3(2.2));
            }

            void main() {
                vec4 s = texture2D(tex, vUv);
                vec3 lin = toLinear(s.rgb);

                // ── Green-screen key in YCbCr chroma space ──
                // Cb = blue-difference chroma, Cr = red-difference chroma
                // For a green pixel: Cb < 0.5, Cr < 0.5, Y moderate-to-high
                // We measure how much green dominates using the "green ratio":
                //   greenRatio = G / (R + G + B + epsilon)
                float eps = 0.001;
                float greenRatio = lin.g / (lin.r + lin.g + lin.b + eps);

                // Also guard against very dark pixels (shadows on green screen)
                float luminance = dot(lin, vec3(0.2126, 0.7152, 0.0722));
                float darkMask  = smoothstep(0.01, 0.08, luminance); // near-black stays opaque

                // Key: greenRatio > threshold means background
                float key   = smoothstep(threshold - smoothing,
                                         threshold + smoothing,
                                         greenRatio);
                float alpha = 1.0 - key * darkMask;

                // Hard cut — anything more transparent than 5% gets fully discarded
                if (alpha < 0.05) discard;

                // Spill suppression: replace green channel with average of R+B on edges
                vec3 col = s.rgb;
                float spillAmount = key * darkMask;
                col.g = mix(col.g, (col.r + col.b) * 0.5, spillAmount);

                gl_FragColor = vec4(col, alpha);
            }
        `,
        transparent: true,
        alphaTest: 0.05,
        side: THREE.DoubleSide,
        depthWrite: false,
        // Tell Three.js not to apply tone-mapping to this material —
        // video is already display-ready; tone-mapping shifts colours
        // and breaks the key.
        toneMapped: false
    });
}

// ── LOAD PERSON (base — video billboard only) ────────────────
function loadPerson(videoPath, displayName, extraModelPath) {
    if (isLoading) return;
    isLoading = true;
    clearScene();
    walkControlsEl.classList.remove('visible');
    emptyState.style.display = 'none';
    loaderOverlay.classList.add('visible');
    setStatus('loading', 'LOADING VIDEO...');

    videoEl = document.createElement('video');
    videoEl.src         = videoPath;
    videoEl.loop        = true;
    videoEl.muted       = true;
    videoEl.playsInline = true;
    videoEl.crossOrigin = 'anonymous';

    videoEl.addEventListener('canplay', () => {
        videoEl.play().catch(() => {});

        videoTex = new THREE.VideoTexture(videoEl);
        videoTex.minFilter  = THREE.LinearFilter;
        videoTex.magFilter  = THREE.LinearFilter;
        videoTex.format     = THREE.RGBAFormat;
        videoTex.colorSpace = THREE.SRGBColorSpace;

        const aspect = (videoEl.videoHeight || 1080) / (videoEl.videoWidth || 1920);
        const planeH = 2.0;
        const planeW = planeH / aspect;

        const geo = new THREE.PlaneGeometry(planeW, planeH);
        const mat = makeChromaMaterial(videoTex);
        personMesh = new THREE.Mesh(geo, mat);
        personMesh.position.y = planeH / 2;

        personGroup = new THREE.Group();
        personGroup.add(personMesh);
        personGroup.scale.setScalar(personScale);
        scene.add(personGroup);

        currentModel = personGroup;
        currentType  = 'person';
        walkProgress = 0;

        // ── If an extra GLB was requested, load it into the scene too ──
        if (extraModelPath) {
            gltfLoader.load(extraModelPath, (gltf) => {
                const m   = gltf.scene;
                const box = new THREE.Box3().setFromObject(m);
                const sz  = box.getSize(new THREE.Vector3());
                const ctr = box.getCenter(new THREE.Vector3());
                const sc  = 2.5 / Math.max(sz.x, sz.y, sz.z);
                m.scale.setScalar(sc);
                m.position.sub(ctr.multiplyScalar(sc));
                m.position.y -= box.min.y * sc;
                m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
                // Store on scene with a tag so clearScene can find it
                m.userData.isCompanionModel = true;
                scene.add(m);
            }, undefined, (err) => console.warn('Companion model failed:', err));
        }

        camera.position.set(0, 4, 12);
        controls.target.set(0, 1, 0);
        controls.update();

        walkControlsEl.classList.add('visible');
        loaderOverlay.classList.remove('visible');
        setStatus('ready', (displayName || 'PERSOANA').toUpperCase());
        nameOverlay.textContent = displayName || 'Persoana';
        isLoading = false;
    }, { once: true });

    videoEl.addEventListener('error', () => {
        loaderOverlay.classList.remove('visible');
        setStatus('error', 'VIDEO LOAD FAILED');
        emptyState.style.display = 'flex';
        isLoading = false;
    }, { once: true });

    videoEl.load();
}

// ── LOAD GLB ─────────────────────────────────────────────────
const gltfLoader = new GLTFLoader();

function loadModel(path, name) {
    if (isLoading) return;
    isLoading = true;
    clearScene();
    walkControlsEl.classList.remove('visible');
    emptyState.style.display = 'none';
    loaderOverlay.classList.add('visible');
    setStatus('loading', 'LOADING...');

    gltfLoader.load(path, (gltf) => {
        const model  = gltf.scene;
        const box    = new THREE.Box3().setFromObject(model);
        const size   = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const scale  = 2.5 / Math.max(size.x, size.y, size.z);

        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));
        model.position.y -= box.min.y * scale;

        model.traverse(o => {
            if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
        });

        scene.add(model);
        currentModel = model;
        currentType  = 'model';

        const nb   = new THREE.Box3().setFromObject(model);
        const ns   = nb.getSize(new THREE.Vector3());
        const dist = Math.max(ns.x, ns.y, ns.z) * 2;
        camera.position.set(0, ns.y * 0.6, dist);
        controls.target.set(0, ns.y * 0.3, 0);
        controls.update();

        loaderOverlay.classList.remove('visible');
        setStatus('ready', name.toUpperCase());
        nameOverlay.textContent = name;
        isLoading = false;
    }, undefined, (err) => {
        console.error(err);
        loaderOverlay.classList.remove('visible');
        setStatus('error', 'LOAD FAILED');
        emptyState.style.display = 'flex';
        isLoading = false;
    });
}

// ── CLEAR SCENE ──────────────────────────────────────────────
function clearScene() {
    // Remove companion GLB models (Persoana M1 etc.)
    const companions = [];
    scene.traverse(obj => { if (obj.userData.isCompanionModel) companions.push(obj); });
    companions.forEach(obj => {
        scene.remove(obj);
        obj.traverse(c => {
            if (c.geometry) c.geometry.dispose();
            if (c.material) [].concat(c.material).forEach(m => m.dispose());
        });
    });

    if (currentModel) {
        scene.remove(currentModel);
        currentModel.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
                [].concat(obj.material).forEach(m => {
                    if (m.uniforms?.tex?.value) m.uniforms.tex.value.dispose();
                    m.dispose();
                });
            }
        });
        currentModel = null;
    }
    if (videoEl) { videoEl.pause(); videoEl.src = ''; videoEl = null; }
    if (videoTex) { videoTex.dispose(); videoTex = null; }
    personGroup = null;
    personMesh  = null;
    currentType = null;

    // Stop audio when scene changes
    stopAudio();
}

// ── SIDEBAR BUTTONS ───────────────────────────────────────────
document.querySelectorAll('.model-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        if (btn.classList.contains('active') || isLoading) return;
        document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (btn.dataset.type === 'person') {
            loadPerson(btn.dataset.path, btn.dataset.name, null);
        } else if (btn.dataset.type === 'person-m1') {
            loadPerson(btn.dataset.path, btn.dataset.name, btn.dataset.model);
        } else {
            loadModel(btn.dataset.path, btn.dataset.name);
        }
    });
});

// ── CONTROLS ─────────────────────────────────────────────────
rotateToggle.addEventListener('change', () => { autoRotate = rotateToggle.checked; });
walkToggle.addEventListener('change',   () => { walkActive  = walkToggle.checked; });
personScaleInput.addEventListener('input', () => {
    personScale = parseFloat(personScaleInput.value) / 10;
    personScaleVal.textContent = personScale.toFixed(1) + 'x';
    if (personGroup) personGroup.scale.setScalar(personScale);
});

walkSpeedInput.addEventListener('input', () => {
    walkSpeed = parseFloat(walkSpeedInput.value) / 10000;
    walkSpeedVal.textContent = walkSpeedInput.value;
});

// ── AUDIO CONTROLS ────────────────────────────────────────────
function stopAudio() {
    audioEl.pause();
    audioEl.currentTime = 0;
    audioPlaying = false;
    audioBtn.textContent = '▶';
    audioBtn.classList.remove('playing');
    audioStatusEl.textContent = 'STOPPED';
    audioStatusEl.classList.remove('active');
}

audioBtn.addEventListener('click', () => {
    if (audioPlaying) {
        stopAudio();
    } else {
        audioEl.play().then(() => {
            audioPlaying = true;
            audioBtn.textContent = '⏹';
            audioBtn.classList.add('playing');
            audioStatusEl.textContent = 'PLAYING';
            audioStatusEl.classList.add('active');
        }).catch(err => {
            console.warn('Audio play failed:', err);
            audioStatusEl.textContent = 'ERROR';
        });
    }
});

audioVolInput.addEventListener('input', () => {
    audioEl.volume = parseFloat(audioVolInput.value) / 100;
});

// Click-to-log path helper
renderer.domElement.addEventListener('click', () => {
    if (currentType === 'person') {
        const p = camera.position;
        console.log(`%c[PATH POINT]  new THREE.Vector3(${p.x.toFixed(2)}, 0, ${p.z.toFixed(2)}),`, 'color:#a855f7;font-weight:bold');
    }
});

// ── ANIMATION LOOP ────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (currentType === 'model' && autoRotate && currentModel) {
        currentModel.rotation.y += delta * 0.4;
    }

    if (currentType === 'person' && personGroup && personMesh) {
        if (videoTex) videoTex.needsUpdate = true;

        if (walkActive) {
            walkProgress = (walkProgress + walkSpeed) % 1;
        }

        // Position along path
        const pos = walkPath.getPointAt(walkProgress);
        personGroup.position.copy(pos);

        // Billboard — face camera, stay upright
        const dir = new THREE.Vector3()
            .subVectors(camera.position, personGroup.position);
        dir.y = 0;
        if (dir.lengthSq() > 0.0001) {
            personGroup.rotation.y = Math.atan2(dir.x, dir.z);
        }
    }

    controls.update();
    renderer.render(scene, camera);
}
animate();

// ── RESIZE ────────────────────────────────────────────────────
window.addEventListener('resize', () => {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

// ── CONTEXT LOSS ─────────────────────────────────────────────
renderer.domElement.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    setStatus('error', 'CONTEXT LOST — REFRESH');
});

function setStatus(type, text) {
    statusEl.className     = type;
    statusText.textContent = text;
}
</script>
</body>
</html>
