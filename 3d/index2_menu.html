<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0c0f;
            --panel: #0f1318;
            --border: #1e2530;
            --accent: #00c8ff;
            --accent2: #ff6b35;
            --text: #c8d4e0;
            --text-dim: #4a5568;
            --active-bg: rgba(0, 200, 255, 0.08);
            --panel-w: 260px;
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        /* ── SIDEBAR ── */
        #sidebar {
            position: fixed;
            left: 0; top: 0;
            width: var(--panel-w);
            height: 100vh;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
        }

        #sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
        }

        .sidebar-header {
            padding: 28px 20px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header .label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .sidebar-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            line-height: 1.1;
        }

        /* ── MODEL LIST ── */
        .section-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            letter-spacing: 3px;
            color: var(--text-dim);
            text-transform: uppercase;
            padding: 20px 20px 10px;
        }

        #model-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }

        #model-list::-webkit-scrollbar { width: 3px; }
        #model-list::-webkit-scrollbar-track { background: transparent; }
        #model-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .model-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 4px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .model-btn::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.2s ease;
        }

        .model-btn:hover {
            background: var(--active-bg);
            border-color: var(--border);
            color: #fff;
        }

        .model-btn.active {
            background: var(--active-bg);
            border-color: rgba(0, 200, 255, 0.25);
            color: var(--accent);
        }

        .model-btn.active::before {
            transform: scaleY(1);
        }

        .model-btn .icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 15px;
            transition: background 0.2s;
        }

        .model-btn.active .icon {
            background: rgba(0, 200, 255, 0.15);
        }

        .model-btn .name {
            flex: 1;
        }

        .model-btn .sub {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 300;
            display: block;
            line-height: 1;
            margin-top: 2px;
        }

        .model-btn.active .sub {
            color: rgba(0, 200, 255, 0.5);
        }

        /* ── CONTROLS SECTION ── */
        .controls-section {
            border-top: 1px solid var(--border);
            padding: 16px 20px 20px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .toggle-label {
            display: flex;
            flex-direction: column;
        }

        .toggle-label span {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
        }

        .toggle-label small {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 300;
        }

        /* Toggle switch */
        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.25s;
        }

        .toggle-track::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 3px;
            width: 18px;
            height: 18px;
            background: var(--text-dim);
            border-radius: 50%;
            transition: transform 0.25s, background 0.25s;
        }

        .toggle input:checked + .toggle-track {
            background: rgba(0, 200, 255, 0.2);
            border: 1px solid rgba(0, 200, 255, 0.4);
        }

        .toggle input:checked + .toggle-track::after {
            transform: translateX(20px);
            background: var(--accent);
            box-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
        }

        /* ── STATUS BAR ── */
        #status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            padding: 10px 20px 14px;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
        }

        #status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
            margin-right: 6px;
            vertical-align: middle;
            transition: background 0.3s;
        }

        #status.loading .dot { background: var(--accent2); animation: pulse 0.8s infinite; }
        #status.ready .dot   { background: #44ff88; }
        #status.error .dot   { background: #ff4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ── CANVAS AREA ── */
        #canvas-wrap {
            position: fixed;
            left: var(--panel-w);
            top: 0;
            right: 0;
            bottom: 0;
        }

        #canvas-wrap canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* ── OVERLAY: model name ── */
        #model-name-overlay {
            position: fixed;
            bottom: 32px;
            left: calc(var(--panel-w) + 32px);
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.15);
            pointer-events: none;
            transition: color 0.4s;
        }

        /* ── LOADING SCREEN ── */
        #loader-overlay {
            position: fixed;
            left: var(--panel-w);
            top: 0; right: 0; bottom: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #loader-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .loader-inner {
            text-align: center;
        }

        .loader-ring {
            width: 48px;
            height: 48px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text-dim);
        }

        /* ── EMPTY STATE ── */
        #empty-state {
            position: fixed;
            left: var(--panel-w);
            top: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 4;
        }

        .empty-inner {
            text-align: center;
            opacity: 0.3;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        .empty-inner p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="sidebar-header">
        <div class="label">// eyemap.ai</div>
        <h1>3D<br>Viewer</h1>
    </div>

    <div class="section-title">Models</div>

    <div id="model-list">
        <button class="model-btn" data-path="./models/charlie.glb" data-name="Charlie">
            <div class="icon">◈</div>
            <div class="name">
                Charlie
                <span class="sub">.glb</span>
            </div>
        </button>
        <button class="model-btn" data-path="./models/robinet.glb" data-name="Robinet">
            <div class="icon">◈</div>
            <div class="name">
                Robinet
                <span class="sub">.glb</span>
            </div>
        </button>
        <button class="model-btn" data-path="./models/statuie_florilor.glb" data-name="Statuie Florilor">
            <div class="icon">◈</div>
            <div class="name">
                Statuie Florilor
                <span class="sub">.glb</span>
            </div>
        </button>
    </div>

    <div class="controls-section">
        <div class="section-title" style="padding: 0 0 8px;">Controls</div>
        <div class="toggle-row">
            <div class="toggle-label">
                <span>Auto Rotate</span>
                <small>Slow spin on Y axis</small>
            </div>
            <label class="toggle">
                <input type="checkbox" id="rotate-toggle">
                <div class="toggle-track"></div>
            </label>
        </div>
    </div>

    <div id="status">
        <span class="dot"></span>
        <span id="status-text">SELECT A MODEL</span>
    </div>
</div>

<!-- CANVAS -->
<div id="canvas-wrap"></div>

<!-- LOADING OVERLAY -->
<div id="loader-overlay">
    <div class="loader-inner">
        <div class="loader-ring"></div>
        <div class="loader-text">LOADING MODEL</div>
    </div>
</div>

<!-- EMPTY STATE -->
<div id="empty-state">
    <div class="empty-inner">
        <span class="empty-icon">⬡</span>
        <p>Select a model</p>
    </div>
</div>

<!-- MODEL NAME OVERLAY -->
<div id="model-name-overlay"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── SCENE SETUP ──────────────────────────────────────────
const wrap       = document.getElementById('canvas-wrap');
const scene      = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c0f);

const camera = new THREE.PerspectiveCamera(50, wrap.clientWidth / wrap.clientHeight, 0.01, 1000);
camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(5, 8, 5);
key.castShadow = true;
scene.add(key);

const fill = new THREE.DirectionalLight(0x88aaff, 0.8);
fill.position.set(-5, 2, -3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x00c8ff, 0.4);
rim.position.set(0, -3, -5);
scene.add(rim);

// Grid
const grid = new THREE.GridHelper(20, 40, 0x1e2530, 0x141820);
grid.position.y = -0.01;
scene.add(grid);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 0.5;
controls.maxDistance = 50;

// ── STATE ─────────────────────────────────────────────────
let currentModel  = null;
let autoRotate    = false;
let isLoading     = false;

const loader          = new GLTFLoader();
const loaderOverlay   = document.getElementById('loader-overlay');
const emptyState      = document.getElementById('empty-state');
const statusEl        = document.getElementById('status');
const statusText      = document.getElementById('status-text');
const nameOverlay     = document.getElementById('model-name-overlay');
const rotateToggle    = document.getElementById('rotate-toggle');

// ── LOAD MODEL ────────────────────────────────────────────
function loadModel(path, name) {
    if (isLoading) return;
    isLoading = true;

    // Clear previous
    if (currentModel) {
        scene.remove(currentModel);
        currentModel.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
                if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                else obj.material.dispose();
            }
        });
        currentModel = null;
    }

    emptyState.style.display = 'none';
    loaderOverlay.classList.add('visible');
    setStatus('loading', 'LOADING...');

    loader.load(path, (gltf) => {
        const model = gltf.scene;

        // Auto-center and scale
        const box    = new THREE.Box3().setFromObject(model);
        const size   = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale  = 2.5 / maxDim;

        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));
        model.position.y -= box.min.y * scale; // sit on grid

        // Shadows
        model.traverse(obj => {
            if (obj.isMesh) {
                obj.castShadow = true;
                obj.receiveShadow = true;
            }
        });

        scene.add(model);
        currentModel = model;

        // Fit camera
        const newBox  = new THREE.Box3().setFromObject(model);
        const newSize = newBox.getSize(new THREE.Vector3());
        const dist    = Math.max(newSize.x, newSize.y, newSize.z) * 2;
        camera.position.set(0, newSize.y * 0.6, dist);
        controls.target.set(0, newSize.y * 0.3, 0);
        controls.update();

        loaderOverlay.classList.remove('visible');
        setStatus('ready', name.toUpperCase());
        nameOverlay.textContent = name;
        isLoading = false;

    }, undefined, (err) => {
        console.error(err);
        loaderOverlay.classList.remove('visible');
        setStatus('error', 'LOAD FAILED');
        emptyState.style.display = 'flex';
        isLoading = false;
    });
}

function setStatus(type, text) {
    statusEl.className = type;
    statusText.textContent = text;
}

// ── SIDEBAR BUTTONS ───────────────────────────────────────
document.querySelectorAll('.model-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        if (btn.classList.contains('active') || isLoading) return;
        document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadModel(btn.dataset.path, btn.dataset.name);
    });
});

// ── ROTATE TOGGLE ─────────────────────────────────────────
rotateToggle.addEventListener('change', () => {
    autoRotate = rotateToggle.checked;
});

// ── ANIMATION LOOP ────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (autoRotate && currentModel) {
        currentModel.rotation.y += delta * 0.4;
    }

    controls.update();
    renderer.render(scene, camera);
}
animate();

// ── RESIZE ────────────────────────────────────────────────
window.addEventListener('resize', () => {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

// ── CONTEXT LOSS ──────────────────────────────────────────
renderer.domElement.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    setStatus('error', 'CONTEXT LOST — REFRESH');
});
</script>
</body>
</html>
