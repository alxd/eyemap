services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: eyemap-minio
    command: server /data --console-address ":9001"
    ports:
      # Host 9100/9101 — Portainer already uses host 9000
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eyemap}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio-secret}
      # Browser uploads from Vercel origins (presigned PUT/GET)
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # One-shot bucket bootstrap (uses MinIO client against the minio service)
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-eyemap} $${MINIO_ROOT_PASSWORD:-changeme-minio-secret};
      mc mb --ignore-existing local/fundus;
      mc anonymous set none local/fundus;
      echo 'Bucket fundus ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eyemap}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio-secret}
    restart: "no"

volumes:
  minio_data:
